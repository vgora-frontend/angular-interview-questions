@for (tab of tabs(); track tab.key) {
  @if (tab.divider) {
    <span class="divider" aria-hidden="true">|</span>
  }
  <button
    type="button"
    class="tab"
    [class.active]="active() === tab.key"
    [attr.aria-pressed]="active() === tab.key"
    (click)="select(tab.key)"
  >
    {{ tab.label }}
  </button>
}
