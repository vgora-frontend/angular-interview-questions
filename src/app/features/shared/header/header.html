<div class="bar">
  <div class="brand">Angular <span class="ital">Interview</span> Q&amp;A</div>
  <nav class="controls" [attr.aria-label]="'header.controls' | transloco">
    <div class="lang" role="group" [attr.aria-label]="'header.language' | transloco">
      @for (code of langs; track code; let last = $last) {
        <button
          type="button"
          [class.active]="lang() === code"
          [attr.aria-pressed]="lang() === code"
          (click)="setLang(code)"
        >
          {{ code.toUpperCase() }}
        </button>
        @if (!last) {
          <span aria-hidden="true">|</span>
        }
      }
    </div>
    <button
      type="button"
      class="theme"
      [attr.aria-label]="'header.switchTo.' + theme.next() | transloco"
      (click)="theme.toggle()"
    >
      {{ 'header.theme.' + theme.next() | transloco }}
    </button>
    <a href="#author">{{ 'header.about' | transloco }}</a>
  </nav>
</div>
