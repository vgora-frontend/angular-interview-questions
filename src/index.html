<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Angular Interview Q&amp;A</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The .ico comes first for the browsers that ignore the type they cannot
         read; everything current picks the SVG and scales it to whatever the
         tab strip, the bookmark bar or the OS asks for. -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <!-- iOS ignores the SVG above and screenshots the page without this one. -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Relative URLs throughout, so the same file works at / in development
         and under /angular-interview-questions/ on Pages. -->
    <link rel="manifest" href="site.webmanifest" />
    <!-- Tints the browser chrome on mobile. One tag, not one per colour scheme:
         the site has its own theme toggle, so ThemeService keeps this in step
         with the theme actually applied rather than with the OS preference.
         The value here is the light theme's --bg, which is ThemeService's own
         fallback before it reads a stored choice. -->
    <meta name="theme-color" content="#fbf9f6" />

    <meta
      name="description"
      content="A curated, evolving Angular interview reference - from signals to zoneless change detection. Every question answered, every answer with a worked example, in English and Ukrainian."
    />

    <!-- Absolute URLs are not a style choice: link scrapers do not resolve
         relative ones, so og:image has to name the deployed origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Angular Interview Q&amp;A" />
    <meta property="og:title" content="Angular Interview Q&amp;A" />
    <meta
      property="og:description"
      content="Every question answered, every answer with a worked example, in English and Ukrainian."
    />
    <meta
      property="og:url"
      content="https://vgora-frontend.github.io/angular-interview-questions/"
    />
    <meta
      property="og:image"
      content="https://vgora-frontend.github.io/angular-interview-questions/images/og-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Angular Interview Q&amp;A, set in a serif over the site's question-mark mark."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
